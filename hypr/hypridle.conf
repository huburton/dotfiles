# Lockscreen: quickshell-native (matches laptop). Fallback hyprlock if qs is down.
$lock_cmd = qs -c ii ipc call lock activate 2>/dev/null || hyprlock

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    inhibit_sleep = 3
    # The claude wrapper holds a systemd idle:sleep inhibitor for whole sessions,
    # which froze the screensaver timer. Video players/games still inhibit it
    # via Wayland/D-Bus.
    ignore_systemd_inhibit = true
}

# OLED burn-in protection: screensaver (looping video over everything,
# bar included) after 2 min idle; any input stops it. Hugo wants only this:
# no screen off, no auto-lock, no suspend.
listener {
    timeout = 120
    on-timeout = ~/.local/bin/oled-screensaver start
    on-resume = ~/.local/bin/oled-screensaver stop
}
